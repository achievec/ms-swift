# Default model source for this checkout. RSI_MODEL_SOURCE overrides this.
# Mac users who can reach ModelScope: RSI_MODEL_SOURCE=modelscope
model_source: hope
# hope clone uses these directories as cwd (~ and $HOME are expanded).
# The repo lands at <root>/<org>/<name>. RSI_MODEL_ROOT and RSI_DATA_ROOT still win.
model_root: /opt/meituan/dolphinfs_liubo108/ms-swift/models
data_root: /opt/meituan/dolphinfs_liubo108/ms-swift/datasets
# misid for `hope login` and `hope clone --username`. RSI_HOPE_USERNAME overrides this.
# Do not put a token in this file; use RSI_HOPE_TOKEN.
hope_username: liyuhao03
# GPU conda env for swift sft / eval / rlhf. Ignored when this file is absent.
# RSI_TRAIN_PYTHON overrides it. RSI_SWIFT_BIN replaces the whole launcher.
train_python: /usr/local/conda/envs/model-train/bin/python
