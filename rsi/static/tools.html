<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数据与运维</title>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="stylesheet" href="/static/tools.css" />
</head>
<body>
  <header class="top">
    <strong>数据与运维</strong>
    <a href="/">返回训练</a>
  </header>
  <main>
    <section class="panel">
      <h2>数据检查</h2>
      <p class="muted">预览样本、检查 solution 关键词是否写进答案，或拆成训练集和留出集。不改正在跑的实验。</p>
      <textarea id="data-text" placeholder="把 jsonl 贴在这里，或选择文件"></textarea>
      <label>留出比例<input id="eval-ratio" type="number" min="0.05" max="0.9" step="0.05" value="0.2" /></label>
      <div class="row-actions">
        <button type="button" id="pick-file" class="ghost">选择文件</button>
        <button type="button" id="inspect" class="primary">检查</button>
        <button type="button" id="split">拆分</button>
        <button type="button" id="pack">筛下一轮候选</button>
        <input id="file" type="file" accept=".jsonl,.json,.txt" hidden />
      </div>
      <div class="log-panel">
        <div class="log-head"><h3>检查结果</h3><span class="log-tools"><button type="button" class="ghost" data-log-copy>复制</button><button type="button" class="ghost" data-log-fullscreen>全屏</button></span></div>
        <pre id="data-out" class="log">还没有结果。</pre>
      </div>
    </section>
    <section class="panel">
      <h2>实验报告与导出</h2>
      <p class="muted">报告只读审计。导出在实验目录外另写一份合并后的模型，不替换训练检查点。</p>
      <label>实验<select id="run"></select></label>
      <div class="row-actions">
        <button type="button" id="report" class="primary">生成报告</button>
        <button type="button" id="ready">检查推理是否就绪</button>
        <button type="button" id="export">合并导出 LoRA</button>
        <button type="button" id="export-status">查看导出状态</button>
      </div>
      <div class="log-panel">
        <div class="log-head"><h3>输出</h3><span class="log-tools"><button type="button" class="ghost" data-log-copy>复制</button><button type="button" class="ghost" data-log-fullscreen>全屏</button></span></div>
        <pre id="run-out" class="log">选择一个实验。</pre>
      </div>
    </section>
  </main>
  <script src="/static/log-tools.js"></script>
  <script src="/static/tools.js"></script>
</body>
</html>
