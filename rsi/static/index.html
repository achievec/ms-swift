<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大模型微调工作台</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="mc">
    <nav class="activity" id="activity" aria-label="工作区">
      <p class="activity-brand">大模型微调工作台</p>
      <button type="button" class="activity-btn" data-tab="deck">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>实验</span>
      </button>
      <button type="button" class="activity-btn" data-tab="flow">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="2" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="4.5" r="2" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="15.5" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 10h6.2a3.8 3.8 0 0 0 3.8-3.8M6 10h6.2a3.8 3.8 0 0 1 3.8 3.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>闭环</span>
      </button>
      <button type="button" class="activity-btn" data-tab="audit">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12M4 10h12M4 15.5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>记录</span>
      </button>
      <button type="button" class="activity-btn" data-tab="serve">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 6.5h10v7H5z" stroke="currentColor" stroke-width="1.4"/><path d="M8 16.5h4M10 13.5v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>推理</span>
      </button>
      <button type="button" class="activity-btn" data-tab="export">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v9M6.5 9.5 10 13l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16.5h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>导出</span>
      </button>
      <a class="activity-link" href="/tools">运维</a>
      <span id="backend-pill" class="activity-pill" hidden></span>
    </nav>
    <div class="workspace">
      <header class="context" id="context">
        <div id="context-body"></div>
      </header>
      <main id="main"></main>
      <section class="dock" id="dock" hidden>
        <div class="dock-bar">
          <strong id="dock-title">控制台</strong>
          <span class="muted dock-hint">日志、曲线和命令</span>
          <button type="button" class="ghost" data-action="dock-toggle">收起</button>
        </div>
        <div id="dock-body"></div>
      </section>
    </div>
  </div>
  <div id="toast" role="status" hidden></div>
  <div id="busy-note" role="status">正在提交…</div>
  <dialog id="confirm-dialog">
    <form id="confirm-form">
      <h2 id="confirm-title">确认</h2>
      <p id="confirm-name" hidden></p>
      <p id="confirm-body" class="muted"></p>
      <div class="row-actions">
        <button type="button" id="confirm-cancel" class="ghost">取消</button>
        <button type="button" id="confirm-ok" class="danger">确定</button>
      </div>
    </form>
  </dialog>
  <dialog id="create-dialog">
    <form id="create-form" method="dialog">
      <p class="kicker">新实验</p>
      <h2>新建实验</h2>
      <p class="muted dialog-lead">名称和场景写入实验记录。模型、类型和模板只在这里可改，创建后各阶段只读展示。SFT 数据集没有默认值，进入后再选。</p>
      <label>实验名称<input name="name" required maxlength="80" placeholder="例如：客服工单一轮" value="" /></label>
      <label>场景说明<textarea name="scenario" required maxlength="500" placeholder="这一轮要解决什么问题"></textarea></label>
      <div id="create-model"></div>
      <div class="row-actions">
        <button type="button" id="create-cancel" class="ghost">取消</button>
        <button type="submit" class="primary">创建并进入 SFT</button>
      </div>
    </form>
  </dialog>
  <dialog id="eval-compare-dialog">
    <form id="eval-compare-form" method="dialog">
      <h2>对比评测报告</h2>
      <p class="muted eval-compare-sub">勾选同实验里已有的评测报告，再点对比。可选本轮或全部轮次（含历史重跑）。</p>
      <div class="eval-picker-toolbar">
        <label class="eval-picker-scope"><input type="radio" name="eval-picker-scope" value="round" data-action="eval-picker-scope"/> 本轮</label>
        <label class="eval-picker-scope"><input type="radio" name="eval-picker-scope" value="all" data-action="eval-picker-scope"/> 全部轮次</label>
        <button type="button" class="ghost" data-action="eval-picker-refresh">刷新列表</button>
      </div>
      <div class="eval-picker-list" data-eval-picker-list="1"><p class="muted">加载评测报告…</p></div>
      <div class="row-actions">
        <button type="button" class="ghost" data-action="eval-picker-close" value="cancel">取消</button>
        <button type="button" class="primary" data-action="eval-picker-compare">对比</button>
      </div>
    </form>
  </dialog>
  <script src="/static/time.js"></script>
  <script src="/static/log-tools.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
