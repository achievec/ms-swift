<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ms-swift RSI 闭环</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">RSI</span>
      <div>
        <strong>递归自改进闭环</strong>
        <small>建在 ms-swift 之上 · 数据 → SFT → 评测 → 在线 RL → 评测 → 晋级 → 下一轮 → 推理</small>
      </div>
    </div>
    <div class="top-meta">
      <a class="pill" href="/swift-ui/">打开 SWIFT Web-UI</a>
      <span id="hardware-pill">1× A100-80G · 18 核 · 约 60GB 可用内存</span>
      <span id="backend-pill">后端</span>
    </div>
  </header>
  <div class="shell">
    <aside>
      <button id="new-run" class="primary block" type="button">新建实验</button>
      <p class="aside-note">每一轮都是人工点下一步。SFT、评测、RL 和部署调用本机 ms-swift，占用 GPU。审计写在 SQLite。</p>
      <div id="run-list"></div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="toast" hidden></div>
  <dialog id="create-dialog">
    <form id="create-form" method="dialog">
      <h2>新建 RSI 实验</h2>
      <p class="muted">从一块基座模型开始。每一轮用场景数据做 SFT，再用在线 RL 拉开和基座的差距，最后由你决定哪个检查点晋级。</p>
      <label>实验名称<input name="name" required maxlength="80" value="IT 运维助手" /></label>
      <label>场景说明<textarea name="scenario" required maxlength="500">企业内部 IT 工单分诊与处理建议。目标是从通用基座迭代出能按步骤处理工单的模型。</textarea></label>
      <label>基座模型 id 或路径<input name="base_model" required maxlength="300" value="Qwen/Qwen2.5-7B-Instruct" /></label>
      <div class="row-actions">
        <button type="button" id="create-cancel" class="ghost">取消</button>
        <button type="submit" class="primary">创建并进入数据阶段</button>
      </div>
    </form>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
